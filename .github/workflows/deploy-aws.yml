name: Deploy AWS

# Manual + on push to main. Deploys the API to EC2 (via SSM Run Command) and
# the frontend to S3 + CloudFront.
#
# Credentials: this AWS account is inside an organization whose service control
# policy denies sts:AssumeRoleWithWebIdentity, so OIDC federation cannot be
# used here. The workflow therefore authenticates with a dedicated IAM user
# whose access keys live in repository secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy frontend + API to AWS
    runs-on: ubuntu-latest
    # Skip cleanly until the resource identifiers are set. (The `secrets`
    # context is not available in a job-level `if`, so the key check happens
    # in the credential step instead.)
    if: vars.AWS_BUCKET != '' && vars.AWS_DISTRIBUTION_ID != ''
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------ API
      - name: Deploy API (SSM Run Command)
        run: |
          set -euo pipefail
          instance_id="${{ vars.AWS_INSTANCE_ID }}"
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["sudo bash /opt/coffee/app/infra/aws/remote/deploy-api.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "command id: $command_id"

          for i in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "attempt $i: $status"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$instance_id" \
                  --query '{out:StandardOutputContent,err:StandardErrorContent}' --output json
                exit 1 ;;
            esac
            sleep 10
          done

      # --------------------------------------------------------- Frontend
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Build
        # .env.production sets VITE_API_BASE_URL empty (same origin via CloudFront).
        run: npm run build

      - name: Guard against dev URLs in the bundle
        run: |
          if grep -rl 'localhost:4000' dist/assets/*.js; then
            echo "::error::Build leaked a dev API URL. Check .env.production"
            exit 1
          fi

      - name: Upload to S3
        run: |
          set -euo pipefail
          bucket="${{ vars.AWS_BUCKET }}"
          aws s3 sync dist "s3://$bucket" --delete --exclude 'index.html' --exclude '*.map' \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$bucket/index.html" \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --paths '/*'

      - name: Smoke test
        run: |
          set -euo pipefail
          site="${{ vars.AWS_SITE_URL }}"
          echo "checking $site/api/health"
          for i in $(seq 1 10); do
            if curl -fsS "$site/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "health check failed"; exit 1

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Site: ${{ vars.AWS_SITE_URL }}"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
