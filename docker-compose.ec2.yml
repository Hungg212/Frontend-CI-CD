# Docker Compose for AWS EC2 (free-tier path)
# Runs the API + PostgreSQL on a single t3.micro instance.
#
# Usage on the server (repo cloned to /opt/coffee/app):
#   cd /opt/coffee/app && docker compose -f docker-compose.ec2.yml up -d --build
# Reads .env from the same directory as this file (docker compose default).

services:
  db:
    image: postgres:16-alpine
    container_name: coffee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-coffee}
      # Keep Postgres small enough for 1 GB RAM
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coffee} -d ${POSTGRES_DB:-coffee}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No published port: only the API container can reach the database.
    networks:
      - coffee-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: coffee-home-blend-api:latest
    container_name: coffee-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-coffee}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coffee}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      # Bound to all interfaces; CloudFront reaches it on port 80 of the host.
      - '80:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - coffee-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
    name: coffee-pgdata

networks:
  coffee-net:
    driver: bridge
