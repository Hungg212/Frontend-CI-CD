services:
  - type: web
    name: coffee-home-blend-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npx tsx src/seed.js && npx tsx src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
    healthCheckPath: /api/health

  - type: web
    name: coffee-home-blend-frontend
    runtime: static
    rootDir: .
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: coffee-home-blend-api
          property: hostUrl
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
