services:
  frontend:
    image: ghcr.io/hungg212/frontend-ci-cd:latest
    container_name: coffee-home-blend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
