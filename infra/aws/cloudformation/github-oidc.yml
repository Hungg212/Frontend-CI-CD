AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Optional CI/CD role: lets GitHub Actions deploy this project without
  long-lived AWS keys (OIDC federation). Only needed if you want auto-deploy
  on push to main. Skip it for a manual deploy.

Parameters:
  GitHubOrg:
    Type: String
    Default: Hungg212
    Description: GitHub user or organisation that owns the repo.

  GitHubRepo:
    Type: String
    Default: Frontend-CI-CD
    Description: Repository name (without the owner).

  Branch:
    Type: String
    Default: main
    Description: Branch allowed to assume the role.

  ProjectName:
    Type: String
    Default: coffee-home-blend

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set to false if this AWS account already has the GitHub OIDC provider
      (only one is allowed per account). The provider ARN is then reused.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-github-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref OidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${Branch}'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3 sync of the frontend build
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-web-*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-web-*/*'
              # CloudFront cache invalidation
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'
              # Redeploy the API on EC2 via SSM Run Command (no SSH key needed)
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: '*'
              # Resolve stack outputs used by the workflow
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  RoleArn:
    Description: Put this in the GitHub repo secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
