# Production Environment Inventory
# ⚠️ Chỉ dùng cho môi trường production thật
# Dùng: ansible-playbook -i inventories/prod.ini

[webservers]
prod-web-01 ansible_host=10.0.2.10 ansible_user=deploy
prod-web-02 ansible_host=10.0.2.11 ansible_user=deploy

[dbservers]
prod-db-01 ansible_host=10.0.2.20 ansible_user=deploy

[all:vars]
env_name=prod
app_name=coffee-home-blend-backend
app_port=4000
node_version=20
pg_version=16
