# ============================================
# Biến chung — áp dụng cho TẤT CẢ máy chủ
# ============================================

# --- Secrets: load từ Ansible Vault ---
# Vault file: group_vars/all/vault.yml (Ansible TỰ ĐỘNG load file này)
# Tạo bằng:  ansible-vault create group_vars/all/vault.yml
# Vault PHẢI chứa 2 biến: vault_db_password, vault_jwt_secret
# Roles sử dụng: {{ vault_db_password }} / {{ vault_jwt_secret }}
# Hoặc gián tiếp: {{ db_password }} / {{ jwt_secret }} (set dưới đây)
db_password: "{{ vault_db_password | default('') }}"
jwt_secret: "{{ vault_jwt_secret | default('') }}"

# --- Application ---
app_name: coffee-home-blend-backend
app_user: deploy
app_group: deploy
app_home: /home/{{ app_user }}/{{ app_name }}
app_port: 4000
app_health_path: /api/health
app_env: production
app_dir: /opt/backend

# --- Directories ---
app_releases_dir: "{{ app_home }}/releases"
app_shared_dir: "{{ app_home }}/shared"
app_current_link: "{{ app_home }}/current"
app_logs_dir: "{{ app_home }}/logs"
app_backup_dir: "{{ app_home }}/backups"

# --- Node.js ---
node_version: "20"

# --- PostgreSQL ---
pg_version: "16"
pg_port: 5432
pg_user: backend_user
pg_db: backend_db
pg_encoding: UTF8

# --- Nginx ---
nginx_version: "1.26"
nginx_sites_dir: /etc/nginx/sites-available
nginx_enabled_dir: /etc/nginx/sites-enabled
nginx_health_path: /healthz

# --- Security ---
ufw_allow_ssh: true
ufw_allow_http: true
ufw_allow_https: true
fail2ban_enabled: true

# --- Monitoring ---
enable_logrotate: true
logrotate_maxsize: 100M
logrotate_rotate: 14

# --- Backup ---
backup_enabled: true
backup_retention_days: 7

# --- Flags cho ansible-playbook ---
deploy_strategy: rolling  # rolling | blue_green
keep_releases: 5

# --- CORS (frontend URL được phép gọi API) ---
frontend_url: "http://localhost:5173"
