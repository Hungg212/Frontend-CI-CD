---
- name: Install PostgreSQL
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - libpq-dev
    state: present
    update_cache: true

- name: Start PostgreSQL service
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Wait for PostgreSQL
  wait_for:
    port: 5432
    delay: 2
    timeout: 30

- name: Create database
  become: true
  become_user: postgres
  shell: psql -c "SELECT 1 FROM pg_database WHERE datname='backend_db'" | grep -q 1 || psql -c "CREATE DATABASE backend_db"
  changed_when: false

- name: Create database user
  become: true
  become_user: postgres
  shell: "psql -t -c \"SELECT 1 FROM pg_roles WHERE rolname='backend_user'\" | grep -q 1 || psql -c \"CREATE USER backend_user WITH PASSWORD '{{ db_password }}'\""
  register: user_created
  changed_when: "'CREATE ROLE' in user_created.stdout"
- name: Grant privileges
  become: true
  become_user: postgres
  shell: psql -c "GRANT ALL PRIVILEGES ON DATABASE backend_db TO backend_user"
  when: user_created.changed

- name: Set PostgreSQL password authentication
  lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    regexp: "^local.*all.*all.*peer"
    line: "local   all             all                                     md5"
    state: present
  notify: Restart PostgreSQL

- name: Update PostgreSQL listen address
  lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: "^listen_addresses"
    line: "listen_addresses = '*'"
    state: present
  notify: Restart PostgreSQL
