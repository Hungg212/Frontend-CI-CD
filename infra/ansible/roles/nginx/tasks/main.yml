---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Start Nginx
  systemd:
    name: nginx
    state: started
    enabled: true

- name: Create Nginx config
  template:
    src: backend.conf.j2
    dest: /etc/nginx/sites-available/backend
    mode: '0644'
  notify: Reload Nginx

- name: Enable backend site
  file:
    src: /etc/nginx/sites-available/backend
    dest: /etc/nginx/sites-enabled/backend
    state: link
  notify: Reload Nginx

- name: Remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Test Nginx config
  command: nginx -t
  changed_when: false
  register: nginx_test

- name: Reload Nginx
  systemd:
    name: nginx
    state: reloaded
  when: nginx_test.rc == 0
