---
# Role: nodejs
# Cài đặt Node.js, npm, PM2 cho quản lý process

- name: Thêm NodeSource GPG key
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://deb.nodesource.com/gpgkey | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
  args:
    creates: /usr/share/keyrings/nodesource.gpg
  changed_when: false

- name: Thêm NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_version }}.x {{ ansible_distribution_release }} main"
    state: present
    update_cache: yes
    filename: nodesource

- name: Cài đặt Node.js {{ node_version }}
  ansible.builtin.apt:
    name: nodejs
    state: present
  notify: Check node version

- name: Cài đặt PM2 globally
  community.general.npm:
    name: pm2
    global: yes
    state: present
    version: latest

- name: Cấu hình PM2 startup cho {{ app_user }}
  ansible.builtin.shell: |
    pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }} | grep -v "PM2" | bash || true
  args:
    creates: /etc/systemd/system/pm2-{{ app_user }}.service
  become_user: "{{ app_user }}"

- name: Tạo systemd service cho PM2 của {{ app_user }}
  ansible.builtin.shell: env PM2_HOME=/home/{{ app_user }}/.pm2 pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }} | tail -1 | bash || true
  args:
    chdir: /home/{{ app_user }}
  become_user: "{{ app_user }}"
  changed_when: false

- name: Cài các global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: yes
    state: present
  loop:
    - npm
    - yarn
  ignore_errors: yes

- name: Cấu hình npm cache + registry
  ansible.builtin.copy:
    dest: "/home/{{ app_user }}/.npmrc"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
    content: |
      cache=/home/{{ app_user }}/.npm
      prefix=/home/{{ app_user }}/.npm-global
      fund=false
      audit=false
