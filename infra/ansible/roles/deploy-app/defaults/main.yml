---
# Defaults cho deploy-app
pm2_instances: max
pm2_exec_mode: cluster
pm2_max_memory: "512M"

# Có chạy seed DB mỗi lần deploy hay không
# Chỉ bật true cho lần deploy đầu hoặc khi thay đổi schema
run_seed: false
deploy_create_env: true

# Số lượng release giữ lại (cũ hơn sẽ tự xoá)
keep_releases: 5
