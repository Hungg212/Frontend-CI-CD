---
- name: Create app directory
  file:
    path: "{{ app_dir | default('/opt/backend') }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create .env file
  template:
    src: .env.j2
    dest: "{{ app_dir | default('/opt/backend') }}/.env"
    owner: root
    group: root
    mode: '0600'

- name: Create systemd service
  template:
    src: backend.service.j2
    dest: /etc/systemd/system/backend.service
    mode: '0644'
  notify: Reload systemd

- name: Enable backend service
  systemd:
    name: backend
    enabled: true
    daemon_reload: true

- name: Start backend service
  systemd:
    name: backend
    state: started
