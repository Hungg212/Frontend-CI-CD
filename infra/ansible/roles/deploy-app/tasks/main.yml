---
# Role: deploy-app
# Triển khai rolling deploy cho Node.js app:
# 1. Upload artifact (tar.gz từ Jenkins) lên server
# 2. Giải nén vào releases/<timestamp>
# 3. Cập nhật symlink current
# 4. Reload PM2
# 5. Smoke test
# 6. Cleanup bản cũ

- name: Tính thời gian release
  ansible.builtin.set_fact:
    release_timestamp: "{{ ansible_date_time.iso8601 | regex_replace('[^0-9]', '') }}"
    release_dir_name: "{{ ansible_date_time.iso8601 | regex_replace('[^0-9]', '') }}-{{ app_version | default('latest') }}"

- name: Tạo thư mục release mới
  ansible.builtin.file:
    path: "{{ app_releases_dir }}/{{ release_dir_name }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Copy artifact lên server
  ansible.builtin.copy:
    src: "{{ app_artifact | default('/tmp/backend.tar.gz') }}"
    dest: "{{ app_home }}/{{ release_dir_name }}.tar.gz"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  when: app_artifact is defined

- name: Giải nén artifact
  ansible.builtin.unarchive:
    src: "{{ app_home }}/{{ release_dir_name }}.tar.gz"
    dest: "{{ app_releases_dir }}/{{ release_dir_name }}"
    remote_src: yes
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    creates: "{{ app_releases_dir }}/{{ release_dir_name }}/package.json"
  become_user: "{{ app_user }}"

- name: Xoá tarball sau khi giải nén
  ansible.builtin.file:
    path: "{{ app_home }}/{{ release_dir_name }}.tar.gz"
    state: absent

- name: Tạo .env từ template nếu chưa có
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_shared_dir }}/env/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0640'
  when: deploy_create_env | default(true)

- name: Symlink shared env vào release
  ansible.builtin.file:
    src: "{{ app_shared_dir }}/env/.env"
    dest: "{{ app_releases_dir }}/{{ release_dir_name }}/.env"
    state: link
    force: yes
    owner: "{{ app_user }}"
    group: "{{ app_group }}"

- name: Symlink shared logs
  ansible.builtin.file:
    src: "{{ app_logs_dir }}"
    dest: "{{ app_releases_dir }}/{{ release_dir_name }}/logs"
    state: link
    force: yes
    owner: "{{ app_user }}"
    group: "{{ app_group }}"

- name: Chạy seed database (nếu cần)
  ansible.builtin.command: "node src/seed.js"
  args:
    chdir: "{{ app_releases_dir }}/{{ release_dir_name }}"
  become_user: "{{ app_user }}"
  register: seed_result
  changed_when: "'Seeded' in seed_result.stdout"
  when: run_seed | default(false) | bool
  ignore_errors: yes

- name: Tạo ecosystem file cho PM2
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ app_shared_dir }}/ecosystem.config.js"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'

- name: Reload/Restart PM2
  community.general.pm2:
    name: "{{ app_name }}"
    state: reloaded
    config_file: "{{ app_shared_dir }}/ecosystem.config.js"
  become_user: "{{ app_user }}"
  register: pm2_result
  until: pm2_result is succeeded
  retries: 3
  delay: 5

- name: Lưu process list cho PM2
  ansible.builtin.command: pm2 save
  args:
    chdir: "/home/{{ app_user }}"
  become_user: "{{ app_user }}"
  changed_when: false

- name: Cập nhật symlink current
  ansible.builtin.file:
    src: "{{ app_releases_dir }}/{{ release_dir_name }}"
    dest: "{{ app_current_link }}"
    state: link
    force: yes
    owner: "{{ app_user }}"
    group: "{{ app_group }}"

- name: Smoke test — kiểm tra /api/health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    method: GET
    status_code: 200
    timeout: 30
  register: health_check
  retries: 5
  delay: 5
  until: health_check.status == 200

- name: Smoke test thành công
  ansible.builtin.debug:
    msg: "✅ App {{ app_name }} version {{ app_version }} deployed & healthy!"

- name: Dọn dẹp các release cũ (giữ lại {{ keep_releases }} bản mới nhất)
  ansible.builtin.shell: |
    cd {{ app_releases_dir }}
    ls -1t | tail -n +{{ keep_releases + 1 }} | xargs -r rm -rf
  changed_when: false
  become_user: "{{ app_user }}"

- name: Ghi log deploy
  ansible.builtin.lineinfile:
    path: "{{ app_logs_dir }}/deploy.log"
    line: "{{ ansible_date_time.iso8601 }} | DEPLOYED | version={{ app_version | default('latest') }} | release={{ release_dir_name }} | by={{ ansible_user_id }}"
    create: yes
    state: present
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
